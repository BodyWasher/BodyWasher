<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="BodyWasher">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FC3F7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4FC3F7" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="card"><rect width="1000" height="240" rx="18"/></clipPath>
    <!-- rubber duck, faces right, origin = waterline center -->
    <g id="duck" stroke="#12232b" stroke-width="3" stroke-linejoin="round">
      <path d="M-30 -6 C-34 -26 -14 -30 0 -24 C10 -20 22 -22 28 -12 C34 0 20 8 0 8 C-20 8 -28 4 -30 -6 Z" fill="#FFD43B"/>
      <circle cx="12" cy="-34" r="14" fill="#FFD43B"/>
      <path d="M24 -36 L38 -32 L24 -27 Z" fill="#FF9F43"/>
      <path d="M-14 -14 C-6 -6 8 -8 12 -16" fill="none"/>
      <circle cx="16" cy="-37" r="2.4" fill="#12232b" stroke="none"/>
    </g>
    <style>
      .title{font:800 68px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff;letter-spacing:1px}
      .b{fill:none;stroke:#bfeaff;stroke-width:2;opacity:0;animation:rise linear infinite}
      .b1{animation-duration:6s}
      .b2{animation-duration:7.5s;animation-delay:1.2s}
      .b3{animation-duration:5.5s;animation-delay:2.4s}
      .b4{animation-duration:8s;animation-delay:.6s}
      .b5{animation-duration:6.5s;animation-delay:3.3s}
      .b6{animation-duration:7s;animation-delay:4.1s}
      @keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.8}80%{opacity:.5}100%{transform:translateY(-170px);opacity:0}}
      .bob{animation:bob 3s ease-in-out infinite}
      .d2{animation-duration:3.6s;animation-delay:-1.1s}
      .d3{animation-duration:3.2s;animation-delay:-2s}
      @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(5px) rotate(3deg)}}
      .wave{animation:drift 8s ease-in-out infinite alternate}
      .wave2{animation:drift 6s ease-in-out infinite alternate-reverse}
      @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-40px)}}
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <circle class="b b1" cx="90"  cy="230" r="7"/>
    <circle class="b b2" cx="220" cy="232" r="4"/>
    <circle class="b b3" cx="780" cy="230" r="8"/>
    <circle class="b b4" cx="900" cy="232" r="5"/>
    <circle class="b b5" cx="350" cy="232" r="3"/>
    <circle class="b b6" cx="620" cy="232" r="4"/>
    <!-- back water -->
    <path class="wave" fill="url(#water)" d="M-20 196 q30 -10 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 V260 H-20 Z"/>
    <!-- ducks -->
    <g transform="translate(410 206) scale(0.9)"><g class="bob"><use xlink:href="#duck"/></g></g>
    <g transform="translate(500 208) scale(1.05)"><g class="bob d2"><use xlink:href="#duck"/></g></g>
    <g transform="translate(585 206) scale(0.75)"><g class="bob d3"><use xlink:href="#duck"/></g></g>
    <!-- front water -->
    <path class="wave2" fill="#4FC3F7" fill-opacity="0.25" d="M-20 208 q30 -8 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 V260 H-20 Z"/>
    <text x="500" y="122" text-anchor="middle" class="title">BodyWasher</text>
  </g>
</svg>
